name: Main Street Hub
description: 'Main Street Hub was a marketing platform for local and small businesses, founded in Austin,
  Texas around 2010, that managed social media, review sites, and online customer engagement on behalf
  of restaurants, salons, and other Main Street merchants. Backed by Bessemer Venture Partners, it was
  acquired by GoDaddy in 2018 and folded into the GoDaddy Social product; the former mainstreethub.com
  domain now 301-redirects to godaddy.com/online-marketing/godaddy-social. No independent developer
  portal, OpenAPI, or public API surface remains, and api.mainstreethub.com does not resolve.'
